name: Build & Distribute to Firebase
on:
  push:
    branches: [main]

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - uses: subosito/flutter-action@v2
      with: { channel: stable, cache: true }
    - run: flutter pub get
    - run: flutter build apk --release --flavor production --target lib/main.dart
    - uses: ruby/setup-ruby@v1
      with: { ruby-version: '3.3', bundler-cache: true, working-directory: android }
    - run: bundle lock --add-platform x86_64-linux
      working-directory: android
    - name: Distribute
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
      run: bundle exec fastlane android firebase_distribution
      working-directory: android
