name: attendence
description: "GuardSync - Attendance Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  go_router: ^15.1.2
  easy_localization: ^3.0.7+1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  # fluttertoast: ^8.2.12
  dio: ^5.7.0

  # Local storage. sqflite has no Windows implementation, so the desktop build
  # goes through sqflite_common_ffi against the bundled SQLite library.
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5

  # Talks to the ZKTeco terminal over TCP on port 4370.
  flutter_zkteco: ^1.2.0

  # Password hashing for the local account store.
  crypto: ^3.0.6
  # Held at 3.12: 3.13 moved to xml 7, which excel (capped at xml <7) cannot
  # live with. 3.13 added only lint fixes, PdfException and SVG hardening —
  # nothing the reports use — so the export keeps its Excel file instead.
  pdf: ^3.12.0
  bidi: ^2.0.13

  # Real .xlsx for the monthly punch export — an employee disputing their own
  # month needs a file they can open, filter and hand back.
  excel: ^4.0.6

  # The native save dialog, so the admin decides where the monthly
  # workbook lands rather than hunting for it afterwards.
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/

  # The type scale is set in these four and nothing else, so they are bundled
  # rather than fetched. Downloading them at runtime, as `google_fonts` did,
  # meant a machine with no internet — which is most staff machines — waited on
  # a request that could never succeed and then rendered the whole app in Segoe
  # UI anyway. Refresh or extend the set with tool/fetch_fonts.ps1; every face
  # listed here must exist on disk or the build fails.
  #
  # 400/500/600/700 for each: the scale asks for regular, medium and semibold,
  # and the widgets use `FontWeight.bold` directly. Declaring a weight means
  # Flutter uses the drawn face instead of synthesising one from the regular,
  # which is the difference the dense tables in this app are built on.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Regular.ttf
          weight: 400
        - asset: assets/fonts/Spectral-Medium.ttf
          weight: 500
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Spectral-Bold.ttf
          weight: 700
